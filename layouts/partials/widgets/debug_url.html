{{ $base := .Site.BaseURL }}
{{ if or (eq $base "") (eq $base "/") }}
<div id="url-debug-message" class="row mt-3 d-none">
  <div class="col">
    <div class="alert alert-warning my-0" role="alert">
      <h5><i class="fas fa-exclamation-triangle"></i> Action required</h5>
      <strong>Problem:</strong>
      The current site URL is "<code class="root-path-text"></code>", which does not match the configured baseURL.
      <br>
      <strong>Solution:</strong>
      Please set baseURL in hugo.toml to "<code class="root-path-text"></code>".
    </div>
  </div>
</div>
<script>
document.addEventListener('DOMContentLoaded', function() {
  var isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  if (isLocal) { return; }

  var configuredStr = {{ .Site.BaseURL | jsonify }};
  var show = false;
  var recommended = location.origin + '/';

  try {
    var conf = new URL(configuredStr);
    var confHost = conf.host;
    var confPath = conf.pathname.replace(/\/+$/, '/') || '/';
    var curHost = location.host;
    var curPath = location.pathname;

    // If host differs, recommend current origin + configured path
    if (confHost !== curHost) {
      show = true;
      recommended = location.origin + confPath;
    } else if (!curPath.startsWith(confPath)) {
      // Same host, but current path not under configured base path
      show = true;
      recommended = location.origin + confPath;
    }
  } catch (e) {
    // Invalid or empty baseURL
    show = true;
    recommended = location.origin + '/';
  }

  if (show) {
    document.getElementById('url-debug-message').classList.remove('d-none');
  }
  document.querySelectorAll('.root-path-text').forEach(function(el){ el.textContent = recommended; });
});
</script>
{{ end }}
